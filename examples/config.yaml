# Demonstrates every QC operator, column renaming, an unconfigured
# pass-through column, and dropping a column by omitting it entirely
# (see "notes", which does not appear below).
columns:
  - name: sample_id

  - name: read_count
    rename: total_reads
    qc:
      # A range: both conditions must pass (ANDed) -- exercises >= and <=.
      - {operator: ">=", value: 1000}
      - {operator: "<=", value: 1000000}

  - name: quality_score
    rename: qc_score
    qc:
      - {operator: ">", value: 30}

  - name: error_rate
    qc:
      - {operator: "<", value: 0.05}

  - name: status
    qc:
      - {operator: "=", value: PASS}

  - name: length
    qc:
      # Passes for any value within 5% of 1,000,000 (950,000-1,050,000).
      - {operator: "~=", value: 1000000, tolerance_percent: 5}

  - name: lot_number
    rename: lot
    # No qc: rules -- demonstrates a column that's renamed and kept, but
    # never evaluated or QC'd.
