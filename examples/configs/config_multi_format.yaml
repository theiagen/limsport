# Adjunct scenario: file_parsing against three genuinely different, non-TSV
# (ish) formats -- each column uses a different tool to extract value(s)
# from a different kind of file, and QC then runs against the *extracted*
# value(s). Kept separate from config.yaml/theiaprok_illumina_pe.tsv
# because none of these formats correspond to anything in a real
# TheiaProk_Illumina_PE table -- that config already demonstrates
# file_parsing against a real gs:// report (quast_report).
#
# `file_parsing` is always a list of named outputs: one entry pulls out a
# single value (metadata_json, qc_report below), several entries pull out
# several values from the *same* file (coverage_tsv below, which has more
# than one column of interest).
#
# `command:` uses YAML's literal block scalar (|) throughout, rather than a
# plain or quoted scalar -- these commands are full of colons (JSON, awk
# field separators, grep patterns) that a plain YAML scalar would otherwise
# misparse as the start of a mapping key.
columns:
    - input_column: sample_id

    - input_column: metadata_json
      file_parsing:
          # JSON, extracted with `python3 -c` (as opposed to a shell one-liner)
          - output_column: mean_depth
            command: |
                python3 -c "import json; print(json.load(open('$FILE'))['run']['metrics']['mean_depth'])"
            qc:
                - { operator: ">=", value: 30 }

    - input_column: coverage_tsv
      file_parsing:
          # A *different* TSV schema than the outer table (mimics `samtools
          # coverage` output) -- two outputs pull two different columns out of
          # the same chr1 row, each with its own awk command and its own QC.
          - output_column: chr1_meandepth
            command: |
                awk -F'\t' '$1 == "chr1" {print $7}' "$FILE"
            qc:
                - { operator: ">=", value: 30 }
          - output_column: chr1_coverage_pct
            command: |
                awk -F'\t' '$1 == "chr1" {print $6}' "$FILE"
            qc:
                - { operator: ">=", value: 95 }

    - input_column: qc_report
      file_parsing:
          # A deliberately invented, non-standard "::"-delimited report format
          # with section markers -- grep finds the line, cut/tr pull the value.
          - output_column: error_rate
            command: |
                grep '^error_rate ::' "$FILE" | cut -d: -f3 | tr -d ' '
            qc:
                - { operator: "<", value: 0.01 }
