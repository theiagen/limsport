# One consolidated example, built around a real Terra data table from PHB's
# TheiaProk_Illumina_PE workflow (originally 491 columns / 70 samples,
# trimmed here to the 15 columns and 11 samples this config actually
# exercises). Two of the real samples' cells were deliberately edited (see
# below and examples/README.md) to demonstrate edge cases the real data
# didn't happen to contain; two more rows (NTC1, PC1) are synthetic,
# added to mimic negative/positive control behavior for set_qc.
#
# This single config demonstrates:
#   - every QC operator (>=, <=, >, <, =, ~=, contains, does_not_contain,
#     is_empty, is_not_empty), including a plain multi-condition AND range
#     (number_contigs) and case_insensitive equality (qc_status)
#   - a column kept but never QC'd (assembler), and a column that's renamed
#     but never QC'd (sequencing_platform -> platform)
#   - conditional qc keyed on a match column (assembly_length, by predicted
#     organism), deliberately with no default: 369711 (Salmonella enterica)
#     has no matching rule and fails as a result
#   - file_parsing against a real gs:// report file, three outputs from one
#     file (quast_report), one of which is itself conditional qc
#   - set_qc (run-level QC): all three match kinds, a rule checking more
#     than one column, and the whole-run-fail behavior (see
#     input_ntc_contaminated.tsv)
#   - column allow-list at real scale (491 real columns down to 15, i.e.
#     every other real column is dropped just by never being mentioned)
#
# A second, wholly separate small table (input_multi_format.tsv +
# config_multi_format.yaml, further down in this directory) demonstrates
# file_parsing against two more file formats (JSON, an invented report
# format) and multi-output extraction from a single non-TSV file -- kept
# separate because those formats don't correspond to anything in a real
# TheiaProk_Illumina_PE table.
columns:
  - name: "entity:theiaprok_illumina_pe_v4-2-0_id"
    rename: sample_id

  - name: assembler                # pass-through: kept, never QC'd

  - name: sequencing_platform
    rename: platform               # renamed, kept, never QC'd

  - name: gambit_predicted_taxon
    rename: predicted_taxon        # pass-through: also the match key for the conditional qc below

  - name: assembly_length
    qc:
      match: gambit_predicted_taxon
      rules:
        "Escherichia coli":
          - {operator: ">=", value: 4600000}
          - {operator: "<=", value: 5900000}
        "Klebsiella pneumoniae":
          - {operator: ">=", value: 5200000}
          - {operator: "<=", value: 5900000}
        "Pseudomonas aeruginosa":
          - {operator: ">=", value: 5500000}
          - {operator: "<=", value: 7100000}

  - name: n50_value
    rename: n50
    qc:
      - {operator: ">", value: 15000}

  - name: number_contigs
    rename: contig_count
    qc:
      # A plain (non-conditional) range: both conditions must pass (ANDed).
      - {operator: ">=", value: 10}
      - {operator: "<=", value: 300}

  - name: combined_mean_q_clean
    rename: mean_quality
    qc:
      - {operator: "~=", value: 36, tolerance_percent: 5}

  - name: est_coverage_clean
    rename: coverage
    qc:
      - {operator: ">=", value: 30}

  - name: fastq_scan_num_reads_clean_pairs
    rename: read_pairs
    qc:
      - {operator: ">=", value: 250000}

  - name: qc_status
    qc:
      - {operator: "=", value: PASS, case_insensitive: true}

  - name: screening_notes
    # No qc: here on purpose -- gated by set_qc below instead. A blank
    # cell is normally an automatic QC failure ("missing value"), which
    # would wrongly fail the negative control's expected-blank result if
    # this column had a fixed qc: rule applied to every row.

  - name: notes                    # pass-through commentary, never QC'd directly

  - name: raw_read_count
    # No qc: here either -- the negative control's raw read count is
    # gated by set_qc below. A single fixed threshold can't apply to both
    # a negative control (expected to be low) and a real sample.

  - name: quast_report
    file_parsing:
      # Cross-validates the native assembly_length/n50 columns above
      # against the same numbers pulled straight out of QUAST's own
      # report.tsv for that sample -- three outputs from one file
      # (real gs:// paths for the real samples, local files for the
      # synthetic NTC1/PC1), localized once and parsed with three
      # independent awk commands.
      - name: quast_n50
        command: |
          awk -F'\t' '$1 == "N50" {print $2}' "$FILE"
        qc:
          match: gambit_predicted_taxon
          rules:
            "Escherichia coli":
              - {operator: ">=", value: 50000}
            "Klebsiella pneumoniae":
              - {operator: ">=", value: 80000}
            "Pseudomonas aeruginosa":
              - {operator: ">=", value: 100000}
      - name: quast_gc_pct
        command: |
          awk -F'\t' '$1 == "GC (%)" {print $2}' "$FILE"
      - name: quast_total_length
        command: |
          awk -F'\t' '$1 == "Total length" {print $2}' "$FILE"

set_qc:
  - name: "NTC has no organism flagged and low raw read count"
    match:
      sample_pattern: "NTC"
    columns:
      - column: screening_notes
        qc:
          - {operator: is_empty}
      - column: raw_read_count
        qc:
          - {operator: "<=", value: 1000}

  - name: "Positive control organism identity confirmed"
    match:
      sample_regex: "^PC-?\\d*$"
    columns:
      - column: screening_notes
        qc:
          - {operator: contains, value: "Escherichia coli", case_insensitive: true}
      - column: notes
        qc:
          - {operator: is_not_empty}

  - name: "No cross-contamination flagged in real samples"
    match:
      samples: ["19050801924", "461023", "CL2021-00283104"]
    columns:
      - column: screening_notes
        qc:
          - {operator: does_not_contain, value: "contaminant", case_insensitive: true}
