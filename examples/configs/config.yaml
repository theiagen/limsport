columns:
  - input_column: "entity:theiaprok_illumina_pe_v4-2-0_id"
    output_column: sample_id

  - input_column: assembler

  - input_column: sequencing_platform
    output_column: platform

  - input_column: gambit_predicted_taxon
    output_column: predicted_taxon

  - input_column: assembly_length
    qc:
      match_column: gambit_predicted_taxon
      cases:
        "Escherichia coli":
          - {operator: ">=", value: 4600000}
          - {operator: "<=", value: 5900000}
        "Klebsiella pneumoniae":
          - {operator: ">=", value: 5200000}
          - {operator: "<=", value: 5900000}
        "Pseudomonas aeruginosa":
          - {operator: ">=", value: 5500000}
          - {operator: "<=", value: 7100000}
    output: false

  - input_column: n50_value
    output_column: n50
    qc:
      - {operator: ">", value: 15000}

  - input_column: number_contigs
    output_column: contig_count
    qc:
      - {operator: ">=", value: 10}
      - {operator: "<=", value: 300}

  - input_column: combined_mean_q_clean
    output_column: mean_quality
    qc:
      - {operator: "~=", value: 36, tolerance_percent: 5}

  - input_column: est_coverage_clean
    output_column: coverage
    qc:
      - {operator: ">=", value: 30}

  - input_column: fastq_scan_num_reads_clean_pairs
    output_column: read_pairs
    qc:
      - {operator: ">=", value: 250000}

  - input_column: qc_status
    qc:
      - {operator: "=", value: PASS, case_insensitive: true}

  - input_column: notes

  - input_column: quast_report
    file_parsing:
      - output_column: quast_n50
        command: |
          awk -F'\t' '$1 == "N50" {print $2}' "$FILE"
        qc:
          match_column: gambit_predicted_taxon
          cases:
            "Escherichia coli":
              - {operator: ">=", value: 50000}
            "Klebsiella pneumoniae":
              - {operator: ">=", value: 80000}
            "Pseudomonas aeruginosa":
              - {operator: ">=", value: 100000}
      - output_column: quast_gc_pct
        command: |
          awk -F'\t' '$1 == "GC (%)" {print $2}' "$FILE"
      - output_column: quast_total_length
        command: |
          awk -F'\t' '$1 == "Total length" {print $2}' "$FILE"

set_qc:
  - rule_name: "NTC has no organism flagged and low raw read count"
    match_samples:
      sample_pattern: "NTC"
    checks:
      - input_column: screening_notes
        qc:
          - {operator: is_empty}
      - input_column: raw_read_count
        qc:
          - {operator: "<=", value: 1000}

  - rule_name: "Positive control organism identity confirmed"
    match_samples:
      sample_regex: "^PC-?\\d*$"
    checks:
      - input_column: screening_notes
        qc:
          - {operator: contains, value: "Escherichia coli", case_insensitive: true}
      - input_column: notes
        qc:
          - {operator: is_not_empty}

  - rule_name: "No cross-contamination flagged in real samples"
    match_samples:
      samples: ["19050801924", "461023", "CL2021-00283104"]
    checks:
      - input_column: screening_notes
        qc:
          - {operator: does_not_contain, value: "contaminant", case_insensitive: true}
