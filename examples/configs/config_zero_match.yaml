# A set_qc rule whose match identifies no sample at all in the input --
# a hard error (there's no sample to attach a QC failure to), not a QC
# failure. Aborts before any output is written.
columns:
  - input_column: "entity:theiaprok_illumina_pe_v4-2-0_id"
    output_column: sample_id

set_qc:
  - rule_name: "NTC has no organism flagged"
    match_samples:
      sample_pattern: "DOES_NOT_EXIST"
    checks:
      - input_column: screening_notes
        qc:
          - {operator: is_empty}
