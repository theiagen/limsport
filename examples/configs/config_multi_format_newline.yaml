# Demonstrates a hard error: the command's result contains a newline
# (after bash's own trailing-newline stripping), which cannot be written
# into a single TSV cell. Aborts the whole export, same as a failing command.
columns:
  - input_column: sample_id
  - input_column: metadata_json
    file_parsing:
      - output_column: mean_depth
        command: |
          printf 'first line\nsecond line\n'
