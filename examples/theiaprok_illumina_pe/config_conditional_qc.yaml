# Demonstrates the conditional form of qc: assembly_length's threshold is
# chosen per row from gambit_predicted_taxon instead of one fixed range
# for every organism -- and the same mechanism works identically inside
# a file_parsing output's own qc (quast_n50, extracted from the real
# gs:// QUAST report).
#
# Compare with config.yaml, whose assembly_length range (>= 2,000,000 and
# <= 6,500,000, tuned around an E. coli-sized genome) incorrectly flags
# SAMN24249320 -- a real, correctly assembled ~6.95 Mb Pseudomonas
# aeruginosa genome -- as too large. Here, Pseudomonas gets its own,
# correct range and SAMN24249320 passes both checks.
#
# There's deliberately no `default:` on either -- a real Salmonella
# enterica sample (369711) is included in samples_conditional_qc.txt
# specifically to show what happens when a row's organism has no
# matching rule: a real QC failure ("no qc rule matches...") on *both*
# the plain column and the file_parsing output, not a silent pass.
columns:
  - name: "entity:theiaprok_illumina_pe_v4-2-0_id"
    rename: sample_id

  - name: gambit_predicted_taxon
    rename: predicted_taxon

  - name: assembly_length
    qc:
      match: gambit_predicted_taxon
      rules:
        "Escherichia coli":
          - {operator: ">=", value: 4600000}
          - {operator: "<=", value: 5900000}
        "Klebsiella pneumoniae":
          - {operator: ">=", value: 5200000}
          - {operator: "<=", value: 5900000}
        "Pseudomonas aeruginosa":
          - {operator: ">=", value: 5500000}
          - {operator: "<=", value: 7100000}

  - name: quast_report
    file_parsing:
      - name: quast_n50
        command: |
          awk -F'\t' '$1 == "N50" {print $2}' "$LIMSPORT_FILE"
        qc:
          match: gambit_predicted_taxon
          rules:
            "Escherichia coli":
              - {operator: ">=", value: 50000}
            "Klebsiella pneumoniae":
              - {operator: ">=", value: 80000}
            "Pseudomonas aeruginosa":
              - {operator: ">=", value: 100000}
