# A real Terra data table from PHB's TheiaProk_Illumina_PE workflow (491
# columns, 70 samples) instead of a synthetic fixture -- this exercises the
# column allow-list at real scale (491 columns down to 10), every QC
# operator against genuine bioinformatics QC metrics, file_parsing against
# real gs:// report files (both single- and multi-output), and conditional
# qc keyed on the predicted organism.
#
# assembly_length and quast_n50 use *conditional* qc: the right threshold
# for either one depends on which organism a sample actually is, not one
# fixed range for every organism. There's deliberately no `default:` on
# either -- a real Salmonella enterica sample (369711, see samples.txt) has
# no matching rule for either check, which surfaces as a real QC failure
# ("no qc rule matches...") rather than a silent pass.
columns:
  - name: "entity:theiaprok_illumina_pe_v4-2-0_id"
    rename: sample_id

  - name: assembler                # pass-through: kept, never QC'd

  - name: gambit_predicted_taxon
    rename: predicted_taxon        # pass-through: also the match key for the conditional qc below

  - name: assembly_length
    qc:
      match: gambit_predicted_taxon
      rules:
        "Escherichia coli":
          - {operator: ">=", value: 4600000}
          - {operator: "<=", value: 5900000}
        "Klebsiella pneumoniae":
          - {operator: ">=", value: 5200000}
          - {operator: "<=", value: 5900000}
        "Pseudomonas aeruginosa":
          - {operator: ">=", value: 5500000}
          - {operator: "<=", value: 7100000}

  - name: n50_value
    rename: n50
    qc:
      - {operator: ">", value: 15000}

  - name: number_contigs
    rename: contig_count
    qc:
      - {operator: "<", value: 300}

  - name: combined_mean_q_clean
    rename: mean_quality
    qc:
      - {operator: "~=", value: 36, tolerance_percent: 5}

  - name: est_coverage_clean
    rename: coverage
    qc:
      - {operator: ">=", value: 30}

  - name: fastq_scan_num_reads_clean_pairs
    rename: read_pairs
    qc:
      - {operator: ">=", value: 250000}

  - name: quast_report
    file_parsing:
      # Cross-validates the native assembly_length/GC% columns above
      # against the same numbers pulled straight out of QUAST's own
      # report.tsv for that sample -- three outputs from one gs:// file,
      # localized once and parsed with three independent awk commands.
      - name: quast_n50
        command: |
          awk -F'\t' '$1 == "N50" {print $2}' "$LIMSPORT_FILE"
        qc:
          match: gambit_predicted_taxon
          rules:
            "Escherichia coli":
              - {operator: ">=", value: 50000}
            "Klebsiella pneumoniae":
              - {operator: ">=", value: 80000}
            "Pseudomonas aeruginosa":
              - {operator: ">=", value: 100000}
      - name: quast_gc_pct
        command: |
          awk -F'\t' '$1 == "GC (%)" {print $2}' "$LIMSPORT_FILE"
      - name: quast_total_length
        command: |
          awk -F'\t' '$1 == "Total length" {print $2}' "$LIMSPORT_FILE"
