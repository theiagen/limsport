# A real Terra data table from PHB's TheiaProk_Illumina_PE workflow (491
# columns, 70 samples) instead of a synthetic fixture -- this exercises the
# column allow-list at real scale (491 columns down to 11), every QC
# operator against genuine bioinformatics QC metrics, and file_parsing
# against real gs:// report files, both single- and multi-output.
#
# Thresholds are deliberately tuned around a typical E. coli genome, so
# QC failures cluster the way they would in a real, taxonomically mixed
# batch: a sample's assembly_length/n50/contigs/coverage often fail
# together (a genuinely fragmented assembly fails more than one metric at
# once), and every non-E.-coli sample fails the taxon check by design --
# see examples/README.md for the full breakdown across all 70 samples.
columns:
  - name: "entity:theiaprok_illumina_pe_v4-2-0_id"
    rename: sample_id

  - name: assembler                # pass-through: kept, never QC'd

  - name: gambit_predicted_taxon
    rename: predicted_taxon
    qc:
      - {operator: "=", value: "Escherichia coli"}

  - name: assembly_length          # range check: >= and <= combined
    qc:
      - {operator: ">=", value: 2000000}
      - {operator: "<=", value: 6500000}

  - name: n50_value
    rename: n50
    qc:
      - {operator: ">", value: 15000}

  - name: number_contigs
    rename: contig_count
    qc:
      - {operator: "<", value: 300}

  - name: combined_mean_q_clean
    rename: mean_quality
    qc:
      - {operator: "~=", value: 36, tolerance_percent: 5}

  - name: est_coverage_clean
    rename: coverage
    qc:
      - {operator: ">=", value: 30}

  - name: fastq_scan_num_reads_clean_pairs
    rename: read_pairs
    qc:
      - {operator: ">=", value: 250000}

  - name: quast_report
    file_parsing:
      # Cross-validates the native assembly_length/n50/GC% columns above
      # against the same numbers pulled straight out of QUAST's own
      # report.tsv for that sample -- three outputs from one gs:// file,
      # localized once and parsed with three independent awk commands.
      - name: quast_n50
        command: |
          awk -F'\t' '$1 == "N50" {print $2}' "$LIMSPORT_FILE"
        qc:
          - {operator: ">=", value: 20000}
      - name: quast_gc_pct
        command: |
          awk -F'\t' '$1 == "GC (%)" {print $2}' "$LIMSPORT_FILE"
      - name: quast_total_length
        command: |
          awk -F'\t' '$1 == "Total length" {print $2}' "$LIMSPORT_FILE"
