# Demonstrates qc_by: assembly_length's threshold is chosen per row from
# gambit_predicted_taxon instead of one fixed range for every organism.
#
# Compare with config.yaml, whose assembly_length range (>= 2,000,000 and
# <= 6,500,000, tuned around an E. coli-sized genome) incorrectly flags
# SAMN24249320 -- a real, correctly assembled ~6.95 Mb Pseudomonas
# aeruginosa genome -- as too large. Here, Pseudomonas gets its own,
# correct range and SAMN24249320 passes.
#
# There's deliberately no `default:` -- a real Salmonella enterica sample
# (369711) is included in samples_qc_by.txt specifically to show what
# happens when a row's organism has no matching rule: a real QC failure
# ("no qc_by rule matches..."), not a silent pass.
columns:
  - name: "entity:theiaprok_illumina_pe_v4-2-0_id"
    rename: sample_id

  - name: gambit_predicted_taxon
    rename: predicted_taxon

  - name: assembly_length
    qc_by:
      match: gambit_predicted_taxon
      rules:
        "Escherichia coli":
          - {operator: ">=", value: 4600000}
          - {operator: "<=", value: 5900000}
        "Klebsiella pneumoniae":
          - {operator: ">=", value: 5200000}
          - {operator: "<=", value: 5900000}
        "Pseudomonas aeruginosa":
          - {operator: ">=", value: 5500000}
          - {operator: "<=", value: 7100000}
